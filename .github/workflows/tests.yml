name: CI Tests & Build

on:
  push:
    branches:
      - develop
      - main
      - 'feat/**'
      - 'test/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    name: Backend (Laravel 12 + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment & SQLite Database
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: Run Pest Test Suite
        run: ./vendor/bin/pest

  frontend-tests-and-build:
    name: Frontend (Vue 3 + Vitest + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production SPA Bundle
        run: npm run build

