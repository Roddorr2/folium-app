services:
  mysql:
    image: mysql:8.0
    container_name: folium-mysql
    restart: unless-stopped
    tty: true
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - folium-mysql-data:/var/lib/mysql
    networks:
      - folium-network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folium-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/docs:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - folium-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
    container_name: folium-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - folium-network

volumes:
  folium-mysql-data:
    driver: local

networks:
  folium-network:
    driver: bridge
