services:
  mysql:
    image: mysql:8.0
    container_name: folium-mysql
    restart: unless-stopped
    tty: true
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-folium_db}"
      MYSQL_USER: "${DB_USERNAME:-folium_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - folium-mysql-data:/var/lib/mysql
    networks:
      - folium-network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  folium-mysql-data:
    driver: local

networks:
  folium-network:
    driver: bridge
